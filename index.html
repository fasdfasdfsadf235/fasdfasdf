<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChainFlow – Wallet Flow Canvas</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{--bg:#0a0e14;--panel:#111722;--line:#232f45;--tx:#dfe6f2;--mu:#7d8aa3;--ac:#f2b84b}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;color-scheme:dark;overflow:hidden;user-select:none;-webkit-user-select:none}
#vp{position:fixed;inset:0;touch-action:none;cursor:grab;background-image:radial-gradient(#27334d 1px,transparent 1px);background-size:24px 24px}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#world>*{position:absolute;left:0;top:0;width:0;height:0;overflow:visible}
#svg{width:1px;height:1px;overflow:visible}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:9px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--tx);cursor:pointer;white-space:nowrap}
.btn:hover{background:#192234;border-color:#3a4a6b}
.btn.p{background:var(--ac);border-color:var(--ac);color:#1c1403;font-weight:600}.btn.p:hover{background:#f7c765}
.btn svg{width:15px;height:15px}
.sep{width:1px;height:22px;background:var(--line);margin:0 2px}
/* nodes */
.node{position:absolute;width:160px;text-align:center;cursor:grab}
.ico{width:48px;height:48px;margin:4px auto 0;border-radius:50%;border:3px solid var(--c);background:color-mix(in srgb,var(--c) 20%,#0a0e14);display:grid;place-items:center;transition:box-shadow .15s}
.node:hover .ico,.node.sel .ico{box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 28%,transparent)}
.ico svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.addr{margin-top:6px;font:700 12px/16px 'JetBrains Mono',ui-monospace,monospace}
.lbl{font-size:11px;line-height:14px;color:#aab6cc;overflow-wrap:anywhere}
.tools{position:absolute;left:50%;top:-26px;height:26px;transform:translateX(-50%);display:none;align-items:flex-end;padding:0 2px}
.node:hover .tools,.node.sel .tools{display:flex}
.tb{width:24px;height:22px;margin:0 2px;display:grid;place-items:center;border-radius:6px;background:var(--panel);border:1px solid var(--line);cursor:pointer;color:var(--tx)}
.tb:hover{background:#222e47}.tb svg{width:13px;height:13px}.tb[data-act=del]:hover{background:#7f1d1d}.tb[data-act=link]{cursor:crosshair}
/* images */
.img{position:absolute;border-radius:8px;cursor:grab}
.img img{width:100%;height:100%;display:block;border-radius:8px;pointer-events:none}
.img:hover,.img.sel{outline:2px solid var(--ac)}
.ibtn{position:absolute;top:-11px;right:-11px;display:none}
.rs{position:absolute;right:-7px;bottom:-7px;width:14px;height:14px;border-radius:4px;background:var(--ac);cursor:nwse-resize;display:none}
.img:hover .ibtn,.img.sel .ibtn{display:grid}.img:hover .rs,.img.sel .rs{display:block}
/* edges */
.ev{stroke:#ef4444;stroke-width:1.8;fill:none;pointer-events:none}.ev.sel{stroke:var(--ac)}
.hit{stroke:transparent;stroke-width:16;fill:none;pointer-events:stroke;cursor:pointer}
.tmp{stroke:var(--ac);stroke-width:2;stroke-dasharray:6 4;fill:none;pointer-events:none}
.elabel{position:absolute;transform:translate(-50%,-50%);background:#0e1420f0;border:1px solid #2a3652;border-radius:6px;padding:1px 6px;font-size:11px;line-height:15px;white-space:nowrap;text-align:center;cursor:pointer}
.elabel small{display:block;font-size:10px;color:var(--mu)}.elabel.sel{border-color:var(--ac)}
.addr{cursor:copy;border-radius:4px}.addr:hover{background:#ffffff14}
/* boxes, pen, themes */
.shape{position:absolute;border:2px dashed var(--c);border-radius:12px;background:color-mix(in srgb,var(--c) 7%,transparent);pointer-events:none}
.sh-h{pointer-events:auto;cursor:grab;display:flex;justify-content:space-between;align-items:center;min-height:26px;padding:2px 8px;border-radius:9px 9px 0 0;background:color-mix(in srgb,var(--c) 28%,transparent);font-size:12px;font-weight:600}
.sh-t{display:none}.shape:hover .sh-t,.shape.sel .sh-t{display:flex}
.shape.sel{outline:2px solid var(--ac);outline-offset:3px}
.shape .rs{display:block;pointer-events:auto}
.sk{fill:none;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}.sk.sel{filter:drop-shadow(0 0 4px var(--ac))}
.drawing #vp,.drawing #vp *{cursor:crosshair!important}
.btn.on{background:#2a2110;border-color:var(--ac);color:var(--ac)}
.th{width:22px;height:22px;border-radius:50%;border:2px solid #3a4a6b;cursor:pointer;padding:0}.th.on{border-color:var(--ac)}
#pen{display:none;position:fixed;z-index:30;left:12px;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.pc{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.pw{width:24px;height:24px;display:grid;place-items:center;border-radius:6px;cursor:pointer;border:1px solid transparent}.pw span{background:#dfe6f2;border-radius:50%;display:block}
.pc.on,.pw.on{border-color:var(--ac)}
/* modal + toast */
#modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:#000a;backdrop-filter:blur(3px)}
.mc{width:min(92vw,420px);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 24px 60px #000b;user-select:text}
.mc h3{font-size:14px;font-weight:600;color:var(--mu);margin:0 0 12px}
.mc input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;outline:none;color:var(--tx);font-size:14px;user-select:text}
.mc input:focus{border-color:var(--ac)}.mc input.big{font:700 16px 'JetBrains Mono',ui-monospace,monospace}
.sw{display:flex;gap:8px;margin:2px 0 16px}.sw button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer}.sw button.on{border-color:#fff}
#toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:#1b2538;border:1px solid var(--line);padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
</style>
</head>
<body>
<div id="vp"><div id="world">
  <div id="shapes"></div>
  <div id="imgs"></div>
  <svg id="svg"><defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker>
    <marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f2b84b"/></marker>
  </defs><g id="eg"></g><g id="sg"></g><path id="tmp" class="tmp"/></svg>
  <div id="nodes"></div>
  <div id="elabels"></div>
</div></div>

<div id="empty" class="fixed inset-0 grid place-items-center text-center pointer-events-none px-6" style="color:var(--mu)">
  <div><div class="text-lg font-semibold" style="color:var(--tx)">Trace the money</div>
  <div class="text-sm mt-1">Double-click anywhere or press N to add a wallet. Paste screenshots with Ctrl+V.</div></div>
</div>

<div class="fixed left-3 right-3 z-30 flex flex-wrap items-center gap-2" style="top:calc(env(safe-area-inset-top,0px) + 12px)">
  <span class="font-bold tracking-tight mr-1 flex items-center gap-1.5"><i data-ic="waypoints" style="width:18px;height:18px;color:var(--ac)"></i>ChainFlow</span>
  <button class="btn p" id="ba" title="Shortcut: N or double-click"><i data-ic="plus"></i>Add wallet</button>
  <button class="btn" id="bi"><i data-ic="image"></i>Image</button>
  <button class="btn" id="bb" title="Shortcut: B"><i data-ic="square"></i>Box</button>
  <button class="btn" id="bd" title="Shortcut: D"><i data-ic="pencil"></i>Draw</button>
  <span class="sep"></span>
  <button class="btn" id="bu" title="Undo (Ctrl+Z or Alt+Z)"><i data-ic="undo-2"></i></button>
  <button class="btn" id="br" title="Redo (Ctrl+Shift+Z)"><i data-ic="redo-2"></i></button>
  <span class="sep"></span>
  <span class="flex items-center gap-1.5"><button class="th" data-th="black" style="background:#000" title="Pure dark"></button><button class="th" data-th="dots" style="background:#0a0e14" title="Grid dots"></button><button class="th" data-th="blue" style="background:#0d2b52" title="Blueprint"></button></span>
  <input type="file" id="fi" accept="image/*" multiple hidden>
  <span class="sep"></span>
  <button class="btn" id="bp"><i data-ic="download"></i>Export PNG</button>
  <button class="btn" id="bs" title="Ctrl+S"><i data-ic="save"></i>Save</button>
  <button class="btn" id="bl"><i data-ic="folder-open"></i>Load</button>
  <button class="btn" id="bc"><i data-ic="trash-2"></i><span>Clear</span></button>
</div>

<div class="fixed right-3 z-30 flex items-center gap-1.5" style="bottom:calc(env(safe-area-inset-bottom,0px) + 12px)">
  <button class="btn" id="zo" title="Zoom out"><i data-ic="minus"></i></button>
  <span id="zl" class="text-xs w-10 text-center" style="color:var(--mu)">100%</span>
  <button class="btn" id="zi" title="Zoom in"><i data-ic="plus"></i></button>
  <button class="btn" id="zf" title="Fit everything"><i data-ic="maximize"></i></button>
</div>
<div class="fixed left-3 z-30 text-xs hidden sm:block" style="color:var(--mu);bottom:calc(env(safe-area-inset-bottom,0px) + 16px)">Drag the link icon onto another wallet to draw an arrow · Click an address to copy it · Ctrl+Z undoes</div>
<div id="pen" style="top:calc(env(safe-area-inset-top,0px) + 58px)"></div>
<div id="toast"></div>
<div id="modal"></div>

<script>
const $=s=>document.querySelector(s);
const vp=$('#vp'),world=$('#world'),imgsL=$('#imgs'),shapesL=$('#shapes'),nodesL=$('#nodes'),eg=$('#eg'),elab=$('#elabels'),tmp=$('#tmp'),modal=$('#modal');
const COLORS=['#ef4444','#3b82f6','#f59e0b','#a855f7','#10b981','#64748b'];
const WALLET='M21 12V7H5a2 2 0 0 1 0-4h14v4|M3 5v14a2 2 0 0 0 2 2h16v-5|M18 12a2 2 0 0 0 0 4h4v-4Z';
const walletSvg=`<svg viewBox="0 0 24 24">${WALLET.split('|').map(d=>`<path d="${d}"/>`).join('')}</svg>`;
const blank=()=>({nodes:[],edges:[],images:[],shapes:[],strokes:[],theme:'dots',view:{x:0,y:0,z:1}});
let S=blank(),sel=null,drag=null,lp=null,lastColor=COLORS[0],timer,tool='select',pen={c:'#ffffff',w:4},hist=[],fut=[];
/* inline icons (Lucide paths, no CDN needed) */
const P={
link:'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
pencil:'<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/>',
'trash-2':'<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/>',
plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',minus:'<path d="M5 12h14"/>',x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
image:'<rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>',
download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>',
save:'<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/>',
'folder-open':'<path d="m6 14 1.5-2.9A2 2 0 0 1 9.3 10H20a2 2 0 0 1 1.9 2.5l-1.5 6a2 2 0 0 1-1.9 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.7.9l.8 1.2a2 2 0 0 0 1.7.9H18a2 2 0 0 1 2 2v2"/>',
maximize:'<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>',
square:'<rect width="18" height="18" x="3" y="3" rx="2"/>',
'undo-2':'<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
'redo-2':'<path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/>',
waypoints:'<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="m8 8 8 8"/>'};
function hydrate(){document.querySelectorAll('i[data-ic]').forEach(i=>{const t=document.createElement('template');t.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[i.dataset.ic]||''}</svg>`;const v=t.content.firstChild;for(const a of i.attributes)if(a.name!=='data-ic')v.setAttribute(a.name,a.value);i.replaceWith(v)})}
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short=a=>a.length>13?a.slice(0,6)+'...'+a.slice(-4):a;
const node=id=>S.nodes.find(n=>n.id===id);
const LIST={node:'nodes',img:'images',edge:'edges',shape:'shapes',stroke:'strokes'};
const item=(k,id)=>S[LIST[k]].find(x=>x.id===id);
function toast(m){const t=$('#toast');t.textContent=m;t.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.opacity=0,2200)}
const toWorld=(cx,cy)=>{const r=vp.getBoundingClientRect(),v=S.view;return{x:(cx-r.left-v.x)/v.z,y:(cy-r.top-v.y)/v.z}};
const centerW=()=>{const r=vp.getBoundingClientRect();return toWorld(r.left+r.width/2,r.top+r.height/2)};
const ptr=()=>lp?toWorld(lp[0],lp[1]):centerW();

/* ---------- persistence ---------- */
function touch(){clearTimeout(timer);timer=setTimeout(()=>{try{localStorage.setItem('chainflow:auto',JSON.stringify(S))}catch(e){toast('Browser storage is full. Export a PNG to keep your work.')}},500);$('#empty').style.display=S.nodes.length||S.images.length||S.shapes.length||S.strokes.length?'none':'grid'}
function applyView(){const v=S.view;world.style.transform=`translate(${v.x}px,${v.y}px) scale(${v.z})`;applyTheme(v);vp.style.backgroundPosition=`${v.x}px ${v.y}px`;$('#zl').textContent=Math.round(v.z*100)+'%';touch()}
function load(k){try{const j=JSON.parse(localStorage.getItem(k));if(!j)return false;S=Object.assign(blank(),j);sel=null;render();applyView();return true}catch(e){return false}}

/* ---------- geometry ---------- */
const R=26;
function geo(e){
  const a=node(e.from),b=node(e.to);if(!a||!b)return null;
  const A={x:a.x+80,y:a.y+28},B={x:b.x+80,y:b.y+28},L=Math.hypot(B.x-A.x,B.y-A.y)||1;
  const sib=S.edges.filter(x=>x.from===e.from&&x.to===e.to||x.from===e.to&&x.to===e.from);
  const o=(sib.indexOf(e)-(sib.length-1)/2)*60*(e.from<e.to?1:-1);
  const C={x:(A.x+B.x)/2-(B.y-A.y)/L*o*2,y:(A.y+B.y)/2+(B.x-A.x)/L*o*2};
  const u=(P,Q,r)=>{const d=Math.hypot(Q.x-P.x,Q.y-P.y)||1;return{x:P.x+(Q.x-P.x)/d*r,y:P.y+(Q.y-P.y)/d*r}};
  const s=u(A,C,R),t=u(B,C,R+3);
  return{s,C,t,lx:.25*s.x+.5*C.x+.25*t.x,ly:.25*s.y+.5*C.y+.25*t.y,d:`M${s.x} ${s.y}Q${C.x} ${C.y} ${t.x} ${t.y}`};
}
function bounds(){const xs=[],ys=[];S.nodes.forEach(n=>{xs.push(n.x,n.x+160);ys.push(n.y-4,n.y+110)});[...S.images,...S.shapes].forEach(m=>{xs.push(m.x,m.x+m.w);ys.push(m.y,m.y+m.h)});S.strokes.forEach(s=>s.pts.forEach(q=>{xs.push(q[0]);ys.push(q[1])}));return xs.length?{x0:Math.min(...xs),y0:Math.min(...ys),x1:Math.max(...xs),y1:Math.max(...ys)}:null}

/* ---------- rendering ---------- */
function applySel(){document.querySelectorAll('[data-k]').forEach(el=>{const on=!!sel&&el.dataset.k===sel.k&&el.dataset.id===sel.id;el.classList.toggle('sel',on);if(el.classList.contains('ev'))el.setAttribute('marker-end',on?'url(#ahs)':'url(#ah)')})}
const select=(k,id)=>{sel=k?{k,id}:null;applySel()};
function renderEdges(){
  let p='',l='';
  for(const e of S.edges){const g=geo(e);if(!g)continue;
    p+=`<path class="ev" data-k="edge" data-id="${e.id}" d="${g.d}" marker-end="url(#ah)"/><path class="hit" data-k="edge" data-id="${e.id}" d="${g.d}"/>`;
    if(e.label||e.sub)l+=`<div class="elabel" data-k="edge" data-id="${e.id}" style="left:${g.lx}px;top:${g.ly}px">${esc(e.label)}${e.sub?`<small>${esc(e.sub)}</small>`:''}</div>`}
  eg.innerHTML=p;elab.innerHTML=l;applySel();
}
function render(){
  imgsL.replaceChildren(...S.images.map(m=>{const d=document.createElement('div');d.className='img';d.dataset.k='img';d.dataset.id=m.id;d.style.cssText=`left:${m.x}px;top:${m.y}px;width:${m.w}px;height:${m.h}px`;d.innerHTML='<img draggable="false" alt=""><button class="tb ibtn" data-act="del" title="Remove image"><i data-ic="x"></i></button><div class="rs" data-act="rs"></div>';d.firstChild.src=m.src;return d}));
  nodesL.replaceChildren(...S.nodes.map(n=>{const d=document.createElement('div');d.className='node';d.dataset.k='node';d.dataset.id=n.id;d.style.cssText=`left:${n.x}px;top:${n.y}px;--c:${n.color}`;
    d.innerHTML=`<div class="tools"><button class="tb" data-act="link" title="Drag onto another wallet to connect"><i data-ic="link"></i></button><button class="tb" data-act="edit" title="Edit"><i data-ic="pencil"></i></button><button class="tb" data-act="del" title="Delete"><i data-ic="trash-2"></i></button></div><div class="ico">${walletSvg}</div><div class="addr" title="Click to copy: ${esc(n.addr)}">${esc(short(n.addr))}</div><div class="lbl">${esc(n.label)}</div>`;return d}));
  renderShapes();renderStrokes();renderEdges();hydrate();applySel();touch();
}
function del(k,id){
  snap();if(k==='node')S.edges=S.edges.filter(e=>e.from!==id&&e.to!==id);
  S[LIST[k]]=S[LIST[k]].filter(x=>x.id!==id);if(sel&&sel.id===id)sel=null;render();
}

/* ---------- dialogs ---------- */
function openModal({title,fields,color,onSave}){
  modal.innerHTML=`<div class="mc"><h3>${title}</h3>${fields.map((f,i)=>`<input class="${f.big?'big':''}" placeholder="${esc(f.ph)}" value="${esc(f.v||'')}" autocomplete="off" spellcheck="false">`).join('')}${color?`<div class="sw">${COLORS.map(c=>`<button data-c="${c}" style="background:${c}" class="${c===color?'on':''}" title="Icon color"></button>`).join('')}</div>`:''}<div class="flex justify-end gap-2"><button class="btn" id="mc">Cancel</button><button class="btn p" id="ms">Save</button></div></div>`;
  modal.style.display='flex';
  const ins=[...modal.querySelectorAll('input')];let c=color;
  const close=()=>modal.style.display='none';
  const save=()=>{const v=ins.map(i=>i.value.trim());if(fields[0].req&&!v[0]){ins[0].focus();return}close();onSave(v,c)};
  modal.onclick=e=>{if(e.target===modal)close();const b=e.target.closest('[data-c]');if(b){c=b.dataset.c;modal.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b))}};
  $('#mc').onclick=close;$('#ms').onclick=save;
  ins.forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')save();if(e.key==='Escape')close()});
  ins[0].focus();ins[0].select();
}
function nodeDialog(n,pos){
  openModal({title:n?'Edit wallet':'Add wallet',color:n?.color||lastColor,
    fields:[{ph:'Address / identifier',v:n?.addr,big:1,req:1},{ph:'Label / note (Victim, Main drainer, Bitget exploit...)',v:n?.label}],
    onSave:(v,c)=>{snap();lastColor=c;if(n)Object.assign(n,{addr:v[0],label:v[1],color:c});else S.nodes.push({id:uid(),x:pos.x-80,y:pos.y-28,addr:v[0],label:v[1],color:c});render()}});
}
function edgeDialog(e,fresh){
  openModal({title:'Transfer details',fields:[{ph:'Amount (e.g. 2,032.138 BTC (2 transfers))',v:e.label,big:1},{ph:'Timestamp / note (e.g. Aug 19, 2024 5:23 AM)',v:e.sub}],
    onSave:v=>{if(!fresh)snap();e.label=v[0];e.sub=v[1];renderEdges();touch()}});
}
const addWallet=()=>{const c=centerW(),k=S.nodes.length%6*28;nodeDialog(null,{x:c.x+k-70,y:c.y+k-70})};

/* ---------- images ---------- */
function addImg(file,pos){
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    let src=r.result,w=im.naturalWidth,h=im.naturalHeight;
    if(w>1400){const c=document.createElement('canvas');c.width=1400;c.height=h*1400/w;c.getContext('2d').drawImage(im,0,0,c.width,c.height);src=c.toDataURL(file.type==='image/png'?'image/png':'image/jpeg',.9);h=c.height;w=1400}
    const dw=Math.min(320,w),dh=dw*h/w;
    snap();S.images.push({id:uid(),x:pos.x-dw/2,y:pos.y-dh/2,w:dw,h:dh,src});render()};im.src=r.result};
  r.readAsDataURL(file);
}

/* ---------- themes, history, boxes, pen ---------- */
const TH={black:['#000000',''],dots:['#0a0e14','radial-gradient(#27334d 1px,transparent 1px)'],blue:['#0d2b52','linear-gradient(#ffffff17 1px,transparent 1px),linear-gradient(90deg,#ffffff17 1px,transparent 1px),linear-gradient(#ffffff2e 1px,transparent 1px),linear-gradient(90deg,#ffffff2e 1px,transparent 1px)']};
function applyTheme(v){const t=TH[S.theme]||TH.dots,z=24*v.z,B=z*5;vp.style.backgroundColor=t[0];vp.style.backgroundImage=t[1]||'none';vp.style.backgroundSize=S.theme==='blue'?`${z}px ${z}px,${z}px ${z}px,${B}px ${B}px,${B}px ${B}px`:`${z}px ${z}px`;document.querySelectorAll('[data-th]').forEach(b=>b.classList.toggle('on',b.dataset.th===S.theme))}
const clone=()=>({nodes:S.nodes.map(o=>({...o})),edges:S.edges.map(o=>({...o})),images:S.images.map(o=>({...o})),shapes:S.shapes.map(o=>({...o})),strokes:S.strokes.map(o=>({...o}))});
const push=p=>{hist.push(p);if(hist.length>100)hist.shift();fut.length=0};
const snap=()=>push(clone());
function undo(redo){const from=redo?fut:hist,to=redo?hist:fut;if(!from.length)return toast(redo?'Nothing to redo':'Nothing to undo');to.push(clone());Object.assign(S,from.pop());sel=null;render();toast(redo?'Redo':'Undo')}
const sp=p=>{if(p.length<2)return `M${p[0][0]} ${p[0][1]}l.01 0`;let d=`M${p[0][0]} ${p[0][1]}`;for(let i=1;i<p.length-1;i++)d+=`Q${p[i][0]} ${p[i][1]} ${(p[i][0]+p[i+1][0])/2} ${(p[i][1]+p[i+1][1])/2}`;const l=p[p.length-1];return d+`L${l[0]} ${l[1]}`};
function renderShapes(){shapesL.replaceChildren(...S.shapes.map(m=>{const d=document.createElement('div');d.className='shape';d.dataset.k='shape';d.dataset.id=m.id;d.style.cssText=`left:${m.x}px;top:${m.y}px;width:${m.w}px;height:${m.h}px;--c:${m.color}`;d.innerHTML=`<div class="sh-h"><span>${esc(m.label)}</span><div class="sh-t"><button class="tb" data-act="edit" title="Edit box"><i data-ic="pencil"></i></button><button class="tb" data-act="del" title="Delete box"><i data-ic="trash-2"></i></button></div></div><div class="rs" data-act="rs"></div>`;return d}))}
function renderStrokes(){$('#sg').innerHTML=S.strokes.map(k=>`<path class="sk" data-k="stroke" data-id="${k.id}" style="stroke:${k.c};stroke-width:${k.w}" d="${sp(k.pts)}"/><path class="hit" data-k="stroke" data-id="${k.id}" d="${sp(k.pts)}"/>`).join('');applySel()}
const PC=['#ffffff','#ef4444','#f2b84b','#22c55e','#3b82f6','#a855f7'],PW=[2,4,8];
function penUI(){$('#pen').innerHTML=PC.map(c=>`<button class="pc ${c===pen.c?'on':''}" data-pc="${c}" style="background:${c}" title="Pen color"></button>`).join('')+'<span class="sep"></span>'+PW.map(w=>`<button class="pw ${w===pen.w?'on':''}" data-pw="${w}" title="Pen size"><span style="width:${w+3}px;height:${w+3}px"></span></button>`).join('')}
$('#pen').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.pc)pen.c=b.dataset.pc;if(b.dataset.pw)pen.w=+b.dataset.pw;penUI()};
function setTool(t){tool=t;document.body.classList.toggle('drawing',t==='draw');$('#bd').classList.toggle('on',t==='draw');$('#pen').style.display=t==='draw'?'flex':'none';select(null)}
function shapeDialog(m,pos){openModal({title:m?'Edit box':'Add box',color:m?.color||COLORS[1],fields:[{ph:'Group label (Exchange wallets, Victims...)',v:m?.label,big:1}],
  onSave:(v,c)=>{snap();if(m)Object.assign(m,{label:v[0],color:c});else S.shapes.push({id:uid(),x:pos.x-180,y:pos.y-110,w:360,h:220,label:v[0],color:c});render()}})}
const addBox=()=>shapeDialog(null,centerW());
async function copy(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast('Copied! '+short(t))}

/* ---------- pointer interaction ---------- */
let guard=false;
vp.addEventListener('pointerdown',e=>{
  if(e.button>1)return;
  if(tool==='draw'){const p=toWorld(e.clientX,e.clientY),el=document.createElementNS('http://www.w3.org/2000/svg','path');
    el.setAttribute('class','sk');el.style.cssText=`stroke:${pen.c};stroke-width:${pen.w}`;
    drag={t:'draw',pre:clone(),s:{id:uid(),c:pen.c,w:pen.w,pts:[[p.x,p.y]]},el};el.setAttribute('d',sp(drag.s.pts));$('#sg').appendChild(el);return}
  const a=e.target.closest('[data-act]'),it=e.target.closest('[data-k]'),k=it?.dataset.k;
  if(a&&a.dataset.act==='link'){const n=node(it.dataset.id);select('node',n.id);drag={t:'link',n};return}
  if(a&&a.dataset.act!=='rs')return;
  if(k==='node'||k==='img'||k==='shape'){const m=item(k,it.dataset.id);select(k,m.id);
    const kids=k==='shape'?S.nodes.filter(n=>n.x+80>m.x&&n.x+80<m.x+m.w&&n.y+28>m.y&&n.y+28<m.y+m.h).map(n=>({n,x:n.x,y:n.y})):[];
    drag={t:a?'rs':'mv',k,m,el:it,kids,pre:clone(),sx:e.clientX,sy:e.clientY,ox:m.x,oy:m.y,w:m.w,h:m.h};return}
  if(it){select(k,it.dataset.id);return}
  select(null);drag={t:'pan',sx:e.clientX,sy:e.clientY,ox:S.view.x,oy:S.view.y};vp.style.cursor='grabbing';
});
addEventListener('pointermove',e=>{
  lp=[e.clientX,e.clientY];if(!drag)return;
  const z=S.view.z,d=drag,dx=(e.clientX-d.sx)/z,dy=(e.clientY-d.sy)/z;
  if(d.t==='pan'){S.view.x=d.ox+e.clientX-d.sx;S.view.y=d.oy+e.clientY-d.sy;applyView()}
  else if(d.t==='draw'){const p=toWorld(e.clientX,e.clientY),l=d.s.pts[d.s.pts.length-1];if(Math.hypot(p.x-l[0],p.y-l[1])*z>2){d.s.pts.push([p.x,p.y]);d.el.setAttribute('d',sp(d.s.pts))}}
  else if(d.t==='mv'){if(!d.moved){push(d.pre);d.moved=1}const m=d.m;m.x=d.ox+dx;m.y=d.oy+dy;d.el.style.left=m.x+'px';d.el.style.top=m.y+'px';
    d.kids.forEach(o=>{o.n.x=o.x+dx;o.n.y=o.y+dy;const el=nodesL.querySelector(`[data-id="${o.n.id}"]`);el.style.left=o.n.x+'px';el.style.top=o.n.y+'px'});
    if(d.k==='node'||d.kids.length)renderEdges()}
  else if(d.t==='rs'){if(!d.moved){push(d.pre);d.moved=1}const m=d.m,img=d.k==='img';m.w=Math.max(img?40:80,d.w+dx);m.h=img?m.w*d.h/d.w:Math.max(60,d.h+dy);d.el.style.width=m.w+'px';d.el.style.height=m.h+'px'}
  else if(d.t==='link'){const p=ptr();tmp.setAttribute('d',`M${d.n.x+80} ${d.n.y+28}L${p.x} ${p.y}`)}
});
const endDrag=e=>{
  if(!drag)return;const d=drag;drag=null;vp.style.cursor='';tmp.setAttribute('d','');
  guard=!!d.moved;setTimeout(()=>guard=false);
  if(d.t==='draw'){d.el.remove();push(d.pre);S.strokes.push(d.s);renderStrokes();touch()}
  else if(d.t==='link'&&e.type==='pointerup'){
    const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('.node');
    if(el&&el.dataset.id!==d.n.id){snap();const ed={id:uid(),from:d.n.id,to:el.dataset.id,label:'',sub:''};S.edges.push(ed);renderEdges();select('edge',ed.id);touch();edgeDialog(ed,1)}
  }else if(d.moved)touch();
};
addEventListener('pointerup',endDrag);addEventListener('pointercancel',endDrag);
vp.addEventListener('click',e=>{
  if(guard||tool==='draw')return;
  const a=e.target.closest('[data-act]'),it=e.target.closest('[data-k]');
  if(e.target.closest('.addr')&&it){copy(node(it.dataset.id).addr);return}
  if(!a||!it)return;
  if(a.dataset.act==='del')del(it.dataset.k,it.dataset.id);
  else if(a.dataset.act==='edit'){it.dataset.k==='shape'?shapeDialog(item('shape',it.dataset.id)):nodeDialog(node(it.dataset.id))}
});
vp.addEventListener('dblclick',e=>{
  if(tool==='draw'||e.target.closest('[data-act]'))return;
  const it=e.target.closest('[data-k]'),k=it?.dataset.k;
  if(!it)nodeDialog(null,toWorld(e.clientX,e.clientY));
  else if(k==='node')nodeDialog(item('node',it.dataset.id));
  else if(k==='edge')edgeDialog(item('edge',it.dataset.id));
  else if(k==='shape')shapeDialog(item('shape',it.dataset.id));
});

/* ---------- zoom ---------- */
function zoomAt(f,cx,cy){const v=S.view,r=vp.getBoundingClientRect(),z=Math.min(4,Math.max(.1,v.z*f)),k=z/v.z,px=cx-r.left,py=cy-r.top;v.x=px-(px-v.x)*k;v.y=py-(py-v.y)*k;v.z=z;applyView()}
vp.addEventListener('wheel',e=>{e.preventDefault();const d=e.deltaMode===1?e.deltaY*33:e.deltaY;zoomAt(Math.exp(-d*(e.ctrlKey?.01:.0015)),e.clientX,e.clientY)},{passive:false});
const zc=f=>{const r=vp.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)};
$('#zi').onclick=()=>zc(1.25);$('#zo').onclick=()=>zc(.8);
$('#zf').onclick=()=>{const b=bounds();if(!b)return;const r=vp.getBoundingClientRect(),z=Math.min(1.5,.9*Math.min(r.width/(b.x1-b.x0),r.height/(b.y1-b.y0)));S.view={z,x:(r.width-(b.x0+b.x1)*z)/2,y:(r.height-(b.y0+b.y1)*z)/2};applyView()};

/* ---------- paste / drop / keys ---------- */
addEventListener('paste',e=>{if(modal.style.display==='flex')return;for(const i of e.clipboardData.items)if(i.type.startsWith('image/')){e.preventDefault();addImg(i.getAsFile(),ptr())}});
vp.addEventListener('dragover',e=>e.preventDefault());
vp.addEventListener('drop',e=>{e.preventDefault();const p=toWorld(e.clientX,e.clientY);[...e.dataTransfer.files].filter(f=>f.type.startsWith('image/')).forEach((f,i)=>addImg(f,{x:p.x+i*30,y:p.y+i*30}))});
addEventListener('keydown',e=>{
  if(modal.style.display==='flex'||/INPUT|TEXTAREA/.test(e.target.tagName))return;
  const mod=e.ctrlKey||e.metaKey,plain=!mod&&!e.altKey,key=e.key.toLowerCase();
  if(e.code==='KeyZ'&&(mod||e.altKey)){e.preventDefault();undo(e.shiftKey)}
  else if(mod&&key==='y'){e.preventDefault();undo(1)}
  else if(mod&&key==='s'){e.preventDefault();$('#bs').click()}
  else if((e.key==='Delete'||e.key==='Backspace')&&sel){e.preventDefault();del(sel.k,sel.id)}
  else if(plain&&key==='n'){e.preventDefault();addWallet()}
  else if(plain&&key==='b'){e.preventDefault();addBox()}
  else if(plain&&key==='d'){setTool(tool==='draw'?'select':'draw')}
  else if(e.key==='Escape'){select(null);drag=null;tmp.setAttribute('d','');setTool('select')}
});

/* ---------- toolbar ---------- */
$('#ba').onclick=addWallet;$('#bb').onclick=addBox;$('#bd').onclick=()=>setTool(tool==='draw'?'select':'draw');
$('#bu').onclick=()=>undo();$('#br').onclick=()=>undo(1);
document.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{S.theme=b.dataset.th;applyView()});
$('#bi').onclick=()=>$('#fi').click();
$('#fi').onchange=e=>{const c=centerW();[...e.target.files].forEach((f,i)=>addImg(f,{x:c.x+i*30,y:c.y+i*30}));e.target.value=''};
$('#bs').onclick=()=>{try{localStorage.setItem('chainflow:save',JSON.stringify(S));toast('Graph saved in this browser')}catch(e){toast('Could not save: browser storage is full')}};
$('#bl').onclick=()=>{const pre=clone(),ok=load('chainflow:save');if(ok)push(pre);toast(ok?'Saved graph loaded (Ctrl+Z undoes)':'No saved graph yet. Click Save first.')};
$('#bc').onclick=function(){
  const s=this.lastElementChild;
  if(this.dataset.s){snap();Object.assign(S,{nodes:[],edges:[],images:[],shapes:[],strokes:[]});sel=null;render();this.dataset.s='';s.textContent='Clear'}
  else{this.dataset.s=1;s.textContent='Click again to clear';setTimeout(()=>{this.dataset.s='';s.textContent='Clear'},2500)}
};

/* ---------- PNG export (drawn on a canvas) ---------- */
async function exportPng(){
  const b=bounds();if(!b)return toast('Nothing to export yet');
  const pad=60,W=b.x1-b.x0+pad*2,H=b.y1-b.y0+pad*2,sc=Math.min(2,6000/Math.max(W,H));
  const cv=document.createElement('canvas');cv.width=W*sc;cv.height=H*sc;
  const x=cv.getContext('2d');x.scale(sc,sc);x.translate(pad-b.x0,pad-b.y0);
  x.fillStyle=(TH[S.theme]||TH.dots)[0];x.fillRect(b.x0-pad,b.y0-pad,W,H);
  for(const m of S.shapes){x.save();x.beginPath();x.roundRect(m.x,m.y,m.w,m.h,12);x.globalAlpha=.07;x.fillStyle=m.color;x.fill();x.globalAlpha=1;x.setLineDash([7,5]);x.lineWidth=2;x.strokeStyle=m.color;x.stroke();x.setLineDash([]);
    x.globalAlpha=.28;x.beginPath();x.roundRect(m.x,m.y,m.w,26,[12,12,0,0]);x.fill();x.restore();
    x.fillStyle='#dfe6f2';x.font='600 12px Inter,sans-serif';x.textAlign='left';x.textBaseline='middle';x.fillText(m.label,m.x+10,m.y+14)}
  for(const m of S.images){const im=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=m.src});if(im)x.drawImage(im,m.x,m.y,m.w,m.h)}
  x.textAlign='center';x.textBaseline='top';
  for(const e of S.edges){const g=geo(e);if(!g)continue;
    x.strokeStyle=x.fillStyle='#ef4444';x.lineWidth=1.8;x.beginPath();x.moveTo(g.s.x,g.s.y);x.quadraticCurveTo(g.C.x,g.C.y,g.t.x,g.t.y);x.stroke();
    const a=Math.atan2(g.t.y-g.C.y,g.t.x-g.C.x);x.beginPath();x.moveTo(g.t.x,g.t.y);
    x.lineTo(g.t.x-11*Math.cos(a-.4),g.t.y-11*Math.sin(a-.4));x.lineTo(g.t.x-11*Math.cos(a+.4),g.t.y-11*Math.sin(a+.4));x.fill()}
  for(const k of S.strokes){x.strokeStyle=k.c;x.lineWidth=k.w;x.lineCap=x.lineJoin='round';x.stroke(new Path2D(sp(k.pts)))}
  const wrap=(t,cx,y)=>{let ln='';const L=[];for(const w of (t||'').split(/\s+/)){const nx=ln?ln+' '+w:w;if(x.measureText(nx).width>156&&ln){L.push(ln);ln=w}else ln=nx}if(ln)L.push(ln);L.slice(0,3).forEach((s,i)=>x.fillText(s,cx,y+i*14))};
  for(const n of S.nodes){const cx=n.x+80,cy=n.y+28;
    x.beginPath();x.arc(cx,cy,24,0,7);x.fillStyle='#0a0e14';x.fill();x.globalAlpha=.2;x.fillStyle=n.color;x.fill();x.globalAlpha=1;x.lineWidth=3;x.strokeStyle=n.color;x.stroke();
    x.save();x.translate(cx-11,cy-11);x.scale(22/24,22/24);x.strokeStyle='#fff';x.lineWidth=2;x.lineCap=x.lineJoin='round';WALLET.split('|').forEach(d=>x.stroke(new Path2D(d)));x.restore();
    x.font="700 12px 'JetBrains Mono',ui-monospace,monospace";x.fillStyle='#dfe6f2';x.fillText(short(n.addr),cx,n.y+58);
    x.font='11px Inter,sans-serif';x.fillStyle='#aab6cc';wrap(n.label,cx,n.y+76)}
  const f1='500 11px Inter,sans-serif',f2='10px Inter,sans-serif';
  for(const e of S.edges){const g=geo(e);if(!g||!(e.label||e.sub))continue;
    x.font=f1;const w1=e.label?x.measureText(e.label).width:0;x.font=f2;const w2=e.sub?x.measureText(e.sub).width:0;
    const w=Math.max(w1,w2)+12,h=(e.label?15:0)+(e.sub?13:0)+4;
    x.fillStyle='#0e1420';x.strokeStyle='#2a3652';x.lineWidth=1;x.beginPath();x.roundRect(g.lx-w/2,g.ly-h/2,w,h,6);x.fill();x.stroke();
    let y=g.ly-h/2+3;if(e.label){x.font=f1;x.fillStyle='#dfe6f2';x.fillText(e.label,g.lx,y);y+=15}if(e.sub){x.font=f2;x.fillStyle='#7d8aa3';x.fillText(e.sub,g.lx,y)}}
  cv.toBlob(bl=>{const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='wallet-flow.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)});
}
$('#bp').onclick=exportPng;

/* ---------- init ---------- */
penUI();setTool('select');if(!load('chainflow:auto')){render();applyView()}
</script>
